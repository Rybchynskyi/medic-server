name: Deploy Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show outbound IP
        run: |
          set -ex
          echo "This GitHub Actions runner's outbound IP address:"
          curl -s https://api.ipify.org
          echo
          echo "(this IP is different on every run — GitHub Actions uses a large dynamic range, see https://api.github.com/meta under the 'actions' key)"

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -ex
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          echo "known_hosts content:"
          cat ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -ex
          ssh -v -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "
              export PATH=/usr/local/php84/bin:\$PATH
              echo 'SSH connection OK, running as:'; whoami; pwd
              echo 'php:'; which php; php -v
              echo 'composer:'; which composer || echo 'composer not in PATH'
            "

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -ex
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "
            set -ex
            export PATH=/usr/local/php84/bin:\$PATH
            cd '$DEPLOY_PATH'
            echo '>>> git pull'
            git pull origin main
            echo '>>> composer install'
            composer install --no-dev --optimize-autoloader --no-interaction
            echo '>>> migrate'
            php artisan migrate --force
            echo '>>> cache'
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo 'Deploy completed successfully.'
          "
